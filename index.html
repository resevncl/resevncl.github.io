<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo</title>
  <meta name="description" content="Catálogo de poleras. Consulta por WhatsApp.">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="apple-touch-icon" href="img/favicon.png">
  <link rel="stylesheet" href="styles.css?v=1791327781">
</head>
<body>

  <p class="aviso-promo" id="aviso-promo" hidden></p>

  <header class="header">
    <a class="logo" href="#" id="logo"><img id="logo-img" alt="" hidden><span id="logo-texto" data-tienda></span></a>
    <nav class="menu" id="menu" aria-label="Marcas"></nav>
  </header>

  <main>
    <section class="banner" id="banner" hidden>
      <img id="banner-img" alt="" fetchpriority="high">
      <div class="banner-texto">
        <h1 id="banner-titulo"></h1>
        <a class="boton boton-claro" href="#catalogo" id="banner-boton"></a>
      </div>
    </section>

    <section class="catalogo" id="catalogo">
      <div id="secciones"></div>
      <p class="aviso" id="aviso" hidden></p>
    </section>
  </main>

  <footer class="footer" id="contacto">
    <p class="footer-logo" data-tienda></p>
    <nav class="footer-links" aria-label="Contacto">
      <a id="link-instagram" target="_blank" rel="noopener">Instagram</a>
      <a id="link-whatsapp" target="_blank" rel="noopener">WhatsApp</a>
    </nav>
    <p class="footer-nota">Consultas y pedidos por WhatsApp o Instagram</p>
    <p class="footer-nota" data-entrega hidden></p>
  </footer>

  <!-- Detalle de producto -->
  <div class="detalle" id="detalle" role="dialog" aria-modal="true" aria-labelledby="detalle-nombre" hidden>
    <div class="detalle-caja">
      <button class="detalle-cerrar" id="detalle-cerrar" aria-label="Cerrar">✕</button>
      <div class="detalle-galeria">
        <div class="detalle-fotos" id="detalle-fotos"></div>
        <button class="detalle-flecha detalle-flecha-izq" id="flecha-izq" type="button" aria-label="Foto anterior">&#8249;</button>
        <button class="detalle-flecha detalle-flecha-der" id="flecha-der" type="button" aria-label="Foto siguiente">&#8250;</button>
        <div class="detalle-puntos" id="detalle-puntos"></div>
      </div>
      <div class="detalle-info">
        <p class="detalle-marca" id="detalle-marca"></p>
        <h2 id="detalle-nombre"></h2>
        <p class="detalle-precio" id="detalle-precio" hidden></p>
        <p class="detalle-promo" id="detalle-promo" hidden></p>
        <div class="detalle-grupo" id="detalle-tallas" hidden>
          <h3>Tallas</h3>
          <ul class="chips"></ul>
        </div>
        <div class="detalle-grupo" id="detalle-colores" hidden>
          <h3>Color: <span id="detalle-color-actual"></span></h3>
          <ul class="muestras"></ul>
        </div>
        <a class="boton boton-oscuro" id="detalle-whatsapp" target="_blank" rel="noopener">Consultar por WhatsApp</a>
        <a class="boton boton-borde" id="detalle-instagram" target="_blank" rel="noopener">Consultar por Instagram</a>
        <p class="detalle-entrega" data-entrega hidden></p>
      </div>
    </div>
  </div>

  <script src="config.js?v=1791327781"></script>
  <script src="app.js?v=1791327781"></script>
</body>
</html>
